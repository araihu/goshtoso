# golangci-lint configuration — see https://golangci-lint.run
# Gate: standard linters (errcheck, govet, ineffassign, staticcheck, unused)
# plus cyclop with a hard cyclomatic-complexity ceiling of 20.
version: "2"

linters:
  default: standard
  enable:
    - cyclop
  settings:
    cyclop:
      # Fail any function whose cyclomatic complexity exceeds 20.
      max-complexity: 20
  exclusions:
    # Skip generated files (templ *_templ.go carry the strict
    # "// Code generated ... DO NOT EDIT." header).
    generated: strict

issues:
  # Report every finding — no per-linter or duplicate suppression — so the
  # PR gate never hides offenders behind the default caps.
  max-issues-per-linter: 0
  max-same-issues: 0
