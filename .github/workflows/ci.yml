name: Code CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

# PRs cancel superseded runs per head ref; main pushes each get a unique group
# (run_id) so rapid merges don't cancel the coverage/deploy jobs mid-flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.5'
  TEMPL_VERSION: 'v0.3.1020'
  PLAYWRIGHT_VERSION: 'v0.5700.1'
  GOLANGCI_LINT_VERSION: 'v2.12.2'

jobs:
  lint-build:
    name: Lint, drift checks, build
    runs-on: araihu
    steps:
      - uses: actions/checkout@v6

      - name: Isolate Go caches
        run: |
          set -euo pipefail
          {
            echo "GOMODCACHE=${RUNNER_TEMP}/go-mod-cache/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-lint-build"
            echo "GOCACHE=${RUNNER_TEMP}/go-build-cache/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-lint-build"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # NFS-backed GOMODCACHE/GOCACHE already persist across runs on the
          # self-hosted araihu runner. setup-go's own cache tars+uploads that
          # same tree to the GHA cache backend on every go.sum change — a ~9min
          # post-job step that buys nothing here. Disable it.
          cache: false

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Install Tailwind CSS standalone
        run: |
          set -euo pipefail
          ver="$(cat assets/tailwind.version)"
          curl -fsSL -o /tmp/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/v${ver}/tailwindcss-linux-x64"
          chmod +x /tmp/tailwindcss
          sudo mv /tmp/tailwindcss /usr/local/bin/tailwindcss

      - name: templ generate drift check
        run: |
          templ generate
          git diff --exit-code -- '*_templ.go' \
            || { echo "::error::templ generate drift — run 'templ generate' and commit"; exit 1; }

      - name: Tailwind CSS + theme drift check
        run: |
          go run ./cmd/themegen
          tailwindcss -i css/main.css -o assets/styles.css
          git diff --exit-code -- assets/styles.css assets/goshtoso-theme.css \
            || { echo "::error::css/theme drift — run 'just css' and commit assets/styles.css + assets/goshtoso-theme.css"; exit 1; }

      - name: using-goshtoso skill reference drift check
        run: |
          go run ./cmd/skillgen
          git diff --exit-code -- .claude/skills/using-goshtoso/components-reference.md \
            || { echo "::error::using-goshtoso skill reference is stale — run 'go run ./cmd/skillgen' and commit"; exit 1; }

      - name: vendor JS constants drift check
        run: |
          go run ./cmd/vendorgen -check \
            || { echo "::error::assets/vendor_gen.go is stale — run 'go run ./cmd/vendorgen' and commit"; exit 1; }

      - name: go mod tidy drift check
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum drift — run 'go mod tidy' and commit"; exit 1; }

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt drift in:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (library, root module)
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "${GOLANGCI_LINT_VERSION}"
          "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m

      # The site module builds against the in-repo library at this commit via a
      # throwaway workspace (go.work is gitignored — it never lands in the tree).
      - name: Create dev workspace (root library + site)
        run: go work init . ./site

      - name: go vet (site module)
        run: cd site && go vet ./...

      - name: golangci-lint (site module)
        run: cd site && "$(go env GOPATH)/bin/golangci-lint" run --timeout 5m

      - name: Build server
        run: |
          GOSHTOSO_DOCS_VERSION="$(cd site && GOWORK=off go list -m -f '{{.Version}}' github.com/araihu/goshtoso)"
          go build \
            -ldflags "-X github.com/araihu/goshtoso/site/internal/buildinfo.goDocsVersion=${GOSHTOSO_DOCS_VERSION}" \
            -o bin/server ./site/cmd/server

  # Single test runner: executes the same root-unit + site-unit + E2E sets the
  # old unit-test and e2e jobs ran, but coverage-instrumented — so tests run
  # once, not twice. Test failures fail this job; it also emits the merged
  # coverage profile and updates the badge gist on main.
  test:
    name: Tests + coverage
    runs-on: araihu
    steps:
      - uses: actions/checkout@v6

      - name: Isolate Go caches
        run: |
          set -euo pipefail
          {
            echo "GOMODCACHE=${RUNNER_TEMP}/go-mod-cache/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test"
            echo "GOCACHE=${RUNNER_TEMP}/go-build-cache/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-test"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # NFS-backed GOMODCACHE/GOCACHE already persist across runs on the
          # self-hosted araihu runner. setup-go's own cache tars+uploads that
          # same tree to the GHA cache backend on every go.sum change — a ~9min
          # post-job step that buys nothing here. Disable it.
          cache: false

      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@${{ env.TEMPL_VERSION }}

      - name: Install Tailwind CSS standalone
        run: |
          set -euo pipefail
          ver="$(cat assets/tailwind.version)"
          curl -fsSL -o /tmp/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/v${ver}/tailwindcss-linux-x64"
          chmod +x /tmp/tailwindcss
          sudo mv /tmp/tailwindcss /usr/local/bin/tailwindcss

      - name: Install Playwright + Chromium
        run: |
          go install github.com/playwright-community/playwright-go/cmd/playwright@${{ env.PLAYWRIGHT_VERSION }}
          playwright install --with-deps chromium

      - name: Generate templ + CSS
        run: |
          templ generate
          tailwindcss -i css/main.css -o assets/styles.css

      # The merged coverage profile uses Go's native 1.20+ coverage data format
      # so package tests and the coverage-instrumented demo server can drive
      # the publishable library without counting demo-site package coverage.
      - name: Component unit + E2E coverage
        id: coverage
        run: |
          set -euo pipefail
          root="$PWD"
          component_coverpkg="$(go list ./components/... | paste -sd, -)"

          go work init . ./site

          rm -rf .coverage
          mkdir -p .coverage/unit-root .coverage/unit-site .coverage/e2e .coverage/merged

          root_pkgs="$(go list ./... | grep -v '^github.com/araihu/goshtoso/site/')"
          go test -cover -coverpkg="$component_coverpkg" $root_pkgs -count=1 \
            -args -test.gocoverdir="$root/.coverage/unit-root"

          (
            cd site
            site_pkgs="$(go list ./... | grep -v '/tests/e2e')"
            site_component_coverpkg="$(go list -deps $site_pkgs | grep '^github.com/araihu/goshtoso/components/' | sort -u | paste -sd, -)"
            go test -cover -coverpkg="$site_component_coverpkg" $site_pkgs -count=1 \
              -args -test.gocoverdir="$root/.coverage/unit-site"

            GOSHTOSO_E2E_COVERDIR="$root/.coverage/e2e" \
            GOSHTOSO_E2E_COVERPKG="$component_coverpkg" \
              go test ./tests/e2e/... -count=1 -timeout 15m
          )

          go tool covdata merge \
            -i=.coverage/unit-root,.coverage/unit-site,.coverage/e2e \
            -o=.coverage/merged
          go tool covdata percent -i=.coverage/merged > .coverage/coverage-percent.txt
          go tool covdata textfmt -i=.coverage/merged -o=.coverage/coverage.out
          go tool cover -func=.coverage/coverage.out > .coverage/coverage-func.txt
          go tool cover -html=.coverage/coverage.out -o .coverage/coverage.html

          total_line="$(grep '^total:' .coverage/coverage-func.txt)"
          total_percent="$(printf '%s\n' "$total_line" | sed -E 's/.*\t([0-9.]+)%.*/\1/')"

          # shields.io badge color, mirroring scripts/coveragebadge thresholds.
          color="red"
          awk "BEGIN { exit !($total_percent >= 80) }" && color="brightgreen" || true
          awk "BEGIN { exit !($total_percent >= 60 && $total_percent < 80) }" && color="green" || true
          awk "BEGIN { exit !($total_percent >= 40 && $total_percent < 60) }" && color="yellow" || true

          echo "percent=$total_percent" >> "$GITHUB_OUTPUT"
          echo "color=$color" >> "$GITHUB_OUTPUT"

          echo "$total_line"
          {
            echo "### Component Go coverage"
            echo
            echo '```text'
            echo "$total_line"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Push the freshly computed percentage to the shields.io endpoint gist so
      # the README badge tracks main automatically. Main-push only: PRs compute
      # and surface coverage above but must not mutate the published badge.
      - name: Update coverage badge gist
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: fb3843c3a13793eb6cc0af638bc00ad4
          filename: coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.percent }}%
          color: ${{ steps.coverage.outputs.color }}

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: site/tests/e2e/test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Trigger Fly deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint-build, test]
    runs-on: araihu
    concurrency: deploy-group
    steps:
      - name: Dispatch central deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.FLY_DEPLOY_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'araihu',
              repo: 'fly-deploy',
              event_type: 'goshtoso-main',
              client_payload: {
                goshtoso_ref: context.sha,
                goshtoso_sha: context.sha,
                goshtoso_run_id: String(context.runId),
                source_repository: `${context.repo.owner}/${context.repo.repo}`,
              },
            })
