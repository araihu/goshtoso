name: Deploy site to Cloudflare

on:
  workflow_run:
    workflows: [Required CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-goshtoso-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.repository == 'araihu/goshtoso' && (
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Select verified main revision
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$revision" != "$current" ]]; then
            printf 'deploy=false\n' >> "$GITHUB_OUTPUT"
            printf 'Skipped superseded revision `%s`; main is `%s`.\n' "$revision" "$current" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh run list --repo "$GITHUB_REPOSITORY" --workflow required.yml --event push --branch main --commit "$revision" --status success --json databaseId --jq 'length > 0' | grep -qx true
          printf 'deploy=true\nrevision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - name: Set up Go
        if: steps.source.outputs.deploy == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: site/go.mod
          cache-dependency-path: |
            go.sum
            site/go.sum
      - name: Set up Node.js
        if: steps.source.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked Worker tooling
        if: steps.source.outputs.deploy == 'true'
        working-directory: site
        run: npm ci --ignore-scripts
      - name: Deploy verified revision
        id: deploy
        if: steps.source.outputs.deploy == 'true'
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$REVISION" != "$current" ]]; then
            printf 'Skipped superseded revision `%s` before upload.\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            printf '::error::Configure the CLOUDFLARE_API_TOKEN Actions secret before deploying.\n'
            exit 1
          fi
          npm run deploy -- --tag "$REVISION" --message "main $REVISION (run $GITHUB_RUN_ID)"
          printf 'deployed=true\n' >> "$GITHUB_OUTPUT"
      - name: Check production HTTP, HTMX, cookies, SSE and WebSocket
        if: steps.deploy.outputs.deployed == 'true'
        run: timeout 120s node site/scripts/smoke-deploy.mjs https://goshtoso.araihu.com
      - name: Record deployment
        if: steps.deploy.outputs.deployed == 'true'
        env:
          REVISION: ${{ steps.source.outputs.revision }}
        run: |
          printf 'Deployed verified main revision `%s` to https://goshtoso.araihu.com.\n' "$REVISION" >> "$GITHUB_STEP_SUMMARY"
